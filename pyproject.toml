[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix-ctf"
version = "0.1.0"
description = "Native evidence-first CTF agent runtime with distilled memory and evaluated strategy evolution"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-only"}
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.8,<3", "PyYAML>=6,<7", "python-dotenv>=1,<2", "playwright>=1.48,<2", "mcp>=2.3,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "ruff>=0.8,<1", "build>=1,<2"]
[project.scripts]
phoenix = "phoenix.cli:main"
[tool.setuptools.packages.find]
include = ["phoenix*"]
[tool.setuptools.package-data]
phoenix = ["seeds/*.json", "schema.sql", "agent_extensions/*.ts", "vendor/engine/*.txt"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
